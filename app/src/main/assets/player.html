<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>HackerTube player</title>
<style>html,body,#player{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{border:0;display:block}</style>
</head>
<body>
<div id="player"></div>
<script>
'use strict';
// Substitutions are JSON literals, never raw user-provided HTML.
const videoId = __VIDEO_ID__;
const appOrigin = __APP_ORIGIN__;
const autoStart = __AUTO_START__;
const startSeconds = __START_SECONDS__;
let player;
let foreground = true;
let captionChoice = null; // null means Off for each new playback session.
let captionTracks = [];
function captionOptions() {
  try { return player && typeof player.getOptions === 'function' ? player.getOptions('captions') : []; }
  catch (_) { return []; }
}
function applyCaptionChoice() {
  // Capability-detect exposed module options; never access the cross-origin player's DOM.
  if (captionOptions().includes('track')) player.setOption('captions', 'track', captionChoice || {});
}
function captionSnapshot() {
  const options = captionOptions();
  if (!options.includes('track') || !options.includes('tracklist')) return {supported:false,tracks:[]};
  try {
    captionTracks = player.getOption('captions', 'tracklist') || [];
    const current = player.getOption('captions', 'track') || {};
    // YouTube retains the last track object even after captions are disabled.
    // Report our applied selection rather than mislabeling Off as the last language.
    return {supported:true,current:captionChoice ? captionChoice.languageCode : '',tracks:captionTracks.map((track,index) => {
      let label = track.languageName || track.displayName || track.name || track.languageCode;
      if (typeof label !== 'string') label = label.simpleText || track.languageCode;
      return {index,code:track.languageCode,label:label + (track.kind === 'asr' ? ' (auto-generated)' : '')};
    })};
  } catch (_) { return {supported:false,tracks:[]}; }
}
window.htSetCaptions = function(index) {
  if (!Number.isInteger(index) || index < -1 || index >= captionTracks.length) return;
  captionChoice = index === -1 ? null : captionTracks[index];
  applyCaptionChoice();
};
window.htStatus = {ready:false,state:-1,error:0,blocked:false,time:0,duration:0};
window.onYouTubeIframeAPIReady = function () {
  player = new YT.Player('player', {
    width:'100%', height:'100%', videoId,
    host:'https://www.youtube-nocookie.com',
    playerVars:{origin:appOrigin,autoplay:0,controls:1,playsinline:1,fs:0,rel:0,start:startSeconds,cc_load_policy:1},
    events:{
      onReady:function () {
        htStatus.ready = true;
        applyCaptionChoice();
        // The Activity is entered only after an explicit Watch selection.
        if (foreground && autoStart) player.playVideo();
      },
      onStateChange:function (event) {
        htStatus.state = event.data;
        if (event.data === 1) {
          htStatus.blocked = false;
          if (!foreground) player.pauseVideo();
        }
      },
      onApiChange:function () { applyCaptionChoice(); },
      onError:function (event) { htStatus.error = event.data; },
      onAutoplayBlocked:function () { htStatus.blocked = true; }
    }
  });
};
window.htCommand = function (command) {
  if (command === 'background') foreground = false;
  if (command === 'foreground') foreground = true;
  if (!player || !htStatus.ready) return;
  switch (command) {
    case 'toggle': player.getPlayerState() === 1 ? player.pauseVideo() : player.playVideo(); break;
    case 'play': player.playVideo(); break;
    case 'pause': case 'background': player.pauseVideo(); break;
    case 'rewind': player.seekTo(Math.max(0, player.getCurrentTime()-10), true); break;
    case 'forward': player.seekTo(Math.min(player.getDuration(), player.getCurrentTime()+10), true); break;
    case 'focus': document.getElementById('player').focus(); break;
  }
};
window.htSnapshot = function () {
  if (player && htStatus.ready) {
    htStatus.time = player.getCurrentTime() || 0;
    htStatus.duration = player.getDuration() || 0;
    htStatus.captions = captionSnapshot();
  }
  return htStatus;
};
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
